name: CI/CD - Build & Deploy Map-OS

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: '8.4'

jobs:
  # ─── LINT & TESTS ───
  lint:
    name: Lint (PHP CS Fixer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, iconv, json, mbstring, openssl, pdo, tokenizer, xml
          coverage: none

      - name: Install dependencies
        run: |
          cd application
          composer install --no-progress --no-interaction --prefer-dist

      - name: Run PHP CS Fixer
        run: |
          cd application
          vendor/bin/php-cs-fixer fix --dry-run --diff -v

  # ─── BUILD PHP-FPM IMAGE ───
  build-php-fpm:
    name: Build PHP-FPM Image
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for PHP-FPM
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/php-fpm
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push PHP-FPM
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./docker/etc/php
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}

  # ─── BUILD COMPOSER IMAGE (mesmo Dockerfile, entrypoint diferente) ───
  build-composer:
    name: Build Composer Image
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Composer
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/composer
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Composer
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./docker/etc/php
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
          target: composer-stage

  # ─── DEPLOY TO VM ───
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: [build-php-fpm, build-composer]
    if: github.event_name != 'pull_request'
    environment: ${{ github.event.inputs.environment || github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script_stop: true
          envs: IMAGE_TAG,REGISTRY,IMAGE_NAME
          script: |
            set -e
            cd /opt/docker/mapos
            
            # Determina tag da image
            if [ -n "${{ github.event.inputs.environment }}" ]; then
              TAG="${{ github.event.inputs.environment }}"
            elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
              TAG="latest"
            else
              TAG="${{ github.sha }}"
            fi
            
            echo "=== Deploying tag: $TAG ==="
            
            # Atualiza docker-compose com nova tag
            export IMAGE_TAG=$TAG
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_NAME=${{ env.IMAGE_NAME }}
            
            # Pull novas images
            docker compose -f docker-compose.prod.yml pull php-fpm composer
            
            # Recria containers da app (mantém DB e Nginx)
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate php-fpm composer nginx
            
            # Roda composer install (dependencies podem ter mudado)
            docker compose -f docker-compose.prod.yml --profile tools run --rm composer
            
            # Roda migrations
            docker compose -f docker-compose.prod.yml exec -T php-fpm php /var/www/html/index.php tools/migrate 2>&1 | grep -v "No new migrations" || true
            
            # Limpa images antigas
            docker image prune -f
            
            echo "=== Deploy concluído ==="
            docker compose -f docker-compose.prod.yml ps

  # ─── NOTIFICAÇÃO (opcional) ───
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Deploy falhou! Verifique: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        # Adicione aqui: Slack, Discord, Email, etc.
        # uses: 8398a7/action-slack@v3
        # with:
        #   status: failure
        #   channel: '#deploy'
        #   webhook_url: ${{ secrets.SLACK_WEBHOOK }}